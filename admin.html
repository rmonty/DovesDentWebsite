<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Doves Dent Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="admin">
  <main class="admin-wrap">
    <section class="admin-auth" id="authCard">
      <h1>Owner Dashboard</h1>
      <p>Sign in with Google to edit website content without code changes.</p>
      <button id="signInBtn" class="btn btn-gold">Sign In With Google</button>
      <p class="admin-note">Only approved owner accounts can access this dashboard.</p>
    </section>

    <section class="admin-panel hidden" id="adminPanel">
      <div class="admin-topbar">
        <div>
          <h2>Site Content Editor</h2>
          <p id="signedInAs"></p>
        </div>
        <div class="admin-actions">
          <a href="index.html" class="btn btn-outline-navy">View Site</a>
          <button id="signOutBtn" class="btn btn-navy">Sign Out</button>
        </div>
      </div>

      <form id="contentForm" class="admin-grid">
        <fieldset>
          <legend>Common</legend>
          <label>Business Name<input name="common.businessName" type="text"></label>
          <label>Owner Label<input name="common.ownerLabel" type="text" placeholder="Aaron Dove - Owner / Estimator"></label>
          <label>Phone Display<input name="common.phoneDisplay" type="text" placeholder="806-438-8209"></label>
          <label>Email<input name="common.email" type="email"></label>
          <label>Nav Book Button<input name="common.navBookLabel" type="text"></label>
          <label>Footer Tagline<textarea name="common.footerTagline" rows="3"></textarea></label>
        </fieldset>

        <fieldset>
          <legend>Home</legend>
          <label>Hero Badge<input name="home.heroBadge" type="text"></label>
          <label>Hero Title Top<input name="home.heroTitleTop" type="text"></label>
          <label>Hero Title Accent<input name="home.heroTitleAccent" type="text"></label>
          <label>Hero Subtitle<textarea name="home.heroSubtitle" rows="3"></textarea></label>
          <label>Hero Primary CTA<input name="home.heroPrimaryCta" type="text"></label>
          <label>Hero Secondary CTA<input name="home.heroSecondaryCta" type="text"></label>
          <label>Service 1 Title<input name="home.service1Title" type="text"></label>
          <label>Service 1 Body<textarea name="home.service1Body" rows="3"></textarea></label>
          <label>Service 2 Title<input name="home.service2Title" type="text"></label>
          <label>Service 2 Body<textarea name="home.service2Body" rows="3"></textarea></label>
          <label>Service 3 Title<input name="home.service3Title" type="text"></label>
          <label>Service 3 Body<textarea name="home.service3Body" rows="3"></textarea></label>
          <label>CTA Title<input name="home.ctaTitle" type="text"></label>
          <label>CTA Body<textarea name="home.ctaBody" rows="3"></textarea></label>
          <label>CTA Primary<input name="home.ctaPrimary" type="text"></label>
          <label>CTA Secondary<input name="home.ctaSecondary" type="text"></label>
        </fieldset>

        <fieldset>
          <legend>Services</legend>
          <label>Hero Subtitle<textarea name="services.heroSubtitle" rows="3"></textarea></label>
          <label>Hail Intro Paragraph<textarea name="services.hailBody1" rows="3"></textarea></label>
          <label>PDR Intro Paragraph<textarea name="services.pdrBody1" rows="3"></textarea></label>
          <label>Insurance Intro Paragraph<textarea name="services.insuranceBody1" rows="3"></textarea></label>
        </fieldset>

        <fieldset>
          <legend>FAQ</legend>
          <label>Hero Subtitle<textarea name="faq.heroSubtitle" rows="3"></textarea></label>
        </fieldset>

        <fieldset>
          <legend>Contact</legend>
          <label>Hero Subtitle<textarea name="contact.heroSubtitle" rows="3"></textarea></label>
          <label>Intro Paragraph<textarea name="contact.introBody" rows="3"></textarea></label>
          <label>Response Time Text<input name="contact.responseTime" type="text"></label>
        </fieldset>
      </form>

      <div class="admin-savebar">
        <button id="saveBtn" class="btn btn-gold">Save Changes</button>
        <span id="saveStatus"></span>
      </div>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
